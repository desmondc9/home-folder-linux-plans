stream {
    log_format edge '$remote_addr [$time_local] sni=$ssl_preread_server_name '
                    'upstream=$upstream_addr status=$status sent=$bytes_sent '
                    'received=$bytes_received duration=$session_time';
    access_log /var/log/nginx/stream-access.log edge;

    map $ssl_preread_server_name $tls_backend {
        www.cloudflare.com 127.0.0.1:24444;
        default 127.0.0.1:14443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        preread_timeout 10s;
        proxy_connect_timeout 3s;
        proxy_timeout 24h;
        proxy_socket_keepalive on;
        proxy_next_upstream off;
        proxy_protocol on;
        proxy_pass $tls_backend;
    }

    # sing-box receives raw TLS, not the PROXY header.
    server {
        listen 127.0.0.1:24444 proxy_protocol;
        proxy_protocol_timeout 3s;
        proxy_protocol off;
        proxy_connect_timeout 3s;
        proxy_timeout 24h;
        proxy_socket_keepalive on;
        proxy_next_upstream off;
        proxy_pass 127.0.0.1:24443;
    }
}
