version = 5.8.0
archive_dir = /etc/letsencrypt/archive/signal-align-auth
cert = /etc/letsencrypt/live/signal-align-auth/cert.pem
privkey = /etc/letsencrypt/live/signal-align-auth/privkey.pem
chain = /etc/letsencrypt/live/signal-align-auth/chain.pem
fullchain = /etc/letsencrypt/live/signal-align-auth/fullchain.pem
[renewalparams]
account = __ACME_ACCOUNT_REDACTED__
authenticator = dns-cloudflare
dns_cloudflare_propagation_seconds = 90
dns_cloudflare_credentials = /etc/letsencrypt/cloudflare.ini
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
[acme_renewal_info]
ari_retry_after = 2026-10-29T09:28:57
