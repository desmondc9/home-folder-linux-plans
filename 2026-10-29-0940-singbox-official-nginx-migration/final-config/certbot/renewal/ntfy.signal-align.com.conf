version = 5.8.0
archive_dir = /etc/letsencrypt/archive/ntfy.signal-align.com
cert = /etc/letsencrypt/live/ntfy.signal-align.com/cert.pem
privkey = /etc/letsencrypt/live/ntfy.signal-align.com/privkey.pem
chain = /etc/letsencrypt/live/ntfy.signal-align.com/chain.pem
fullchain = /etc/letsencrypt/live/ntfy.signal-align.com/fullchain.pem
[renewalparams]
account = __ACME_ACCOUNT_REDACTED__
authenticator = dns-cloudflare
dns_cloudflare_credentials = /etc/letsencrypt/cloudflare.ini
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
[acme_renewal_info]
ari_retry_after = 2026-10-29T08:22:59
