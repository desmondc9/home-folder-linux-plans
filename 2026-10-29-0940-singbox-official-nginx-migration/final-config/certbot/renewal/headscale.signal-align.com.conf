# renew_before_expiry = 30 days
version = 5.8.0
archive_dir = /etc/letsencrypt/archive/headscale.signal-align.com
cert = /etc/letsencrypt/live/headscale.signal-align.com/cert.pem
privkey = /etc/letsencrypt/live/headscale.signal-align.com/privkey.pem
chain = /etc/letsencrypt/live/headscale.signal-align.com/chain.pem
fullchain = /etc/letsencrypt/live/headscale.signal-align.com/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = __ACME_ACCOUNT_REDACTED__
authenticator = dns-cloudflare
installer = null
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
dns_cloudflare_propagation_seconds = 30
dns_cloudflare_credentials = /etc/letsencrypt/cloudflare.ini
[acme_renewal_info]
ari_retry_after = 2026-10-29T10:03:29
