net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
# 修复 tailnet 客户端 v4 出口流量被内核判为 martian source 静默丢弃的问题:
# tproxy 打的 fwmark 1 会让内核源地址校验命中表 100 的 local default,
# 判定源地址"属于本机"→ 非 lo 接口收到本地源 → martian 丢弃。
# accept_local=1 放行(tailscale0 是可信内网入口)。
# 注意 tailscale0 由 tailscaled 开机创建,sysctl.d 可能先于它执行,
# 因此 sing-box-tproxy.service 的 ExecStart 里也会再设置一次。
net.ipv4.conf.all.accept_local = 1
net.ipv4.conf.default.accept_local = 1
