serverAddr = "bandwagon.signal-align.com"
serverPort = 7000

auth.method = "token"
auth.token = "__FRP_TOKEN_REDACTED__"

[transport]
tcpMuxKeepaliveInterval = 10   # yamux 层心跳,默认 30s,调短一点更保险
dialServerKeepAlive = 30       # frpc<->frps 底层 TCP 的 SO_KEEPALIVE,默认 7200s(2小时)太长

[[proxies]]
name = "kubuntu-ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = 6000

